version: 1
policy:
  defensive_only: true
  store_untrusted_code: false
  execute_untrusted_code: false
sources:
  - id: nvd-cve-json
    name: NVD CVE JSON Feed
    category: cve
    type: cve_json
    url: https://services.nvd.nist.gov/rest/json/cves/2.0
    enabled: true
    reliability: verified
    tags:
      - cve
      - vulnerability
      - government
  - id: cisa-kev-json
    name: CISA Known Exploited Vulnerabilities Catalog
    category: kev
    type: kev_json
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    enabled: true
    reliability: verified
    tags:
      - kev
      - exploited-in-the-wild
      - government
  - id: cisa-alerts-rss
    name: CISA Cybersecurity Advisories
    category: government_advisory
    type: rss
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    enabled: true
    reliability: high
    tags:
      - advisory
      - government
  - id: microsoft-msrc
    name: Microsoft Security Response Center
    category: vendor_advisory
    type: rss
    url: https://msrc.microsoft.com/blog/feed
    enabled: true
    reliability: high
    tags:
      - vendor
      - microsoft
  - id: google-project-zero
    name: Google Project Zero
    category: security_research_blog
    type: rss
    url: https://googleprojectzero.blogspot.com/feeds/posts/default
    enabled: true
    reliability: high
    tags:
      - research
      - vulnerability
  - id: mandiant-blog
    name: Mandiant Blog
    category: incident_response_firm
    type: rss
    url: https://cloud.google.com/blog/topics/threat-intelligence/rss
    enabled: true
    reliability: high
    tags:
      - incident-response
      - threat-intel
  - id: unit42-blog
    name: Palo Alto Unit 42
    category: malware_analysis_blog
    type: rss
    url: https://unit42.paloaltonetworks.com/feed
    enabled: true
    reliability: high
    tags:
      - malware
      - threat-intel
  - id: owasp-ai-exchange
    name: OWASP AI Exchange
    category: ai_security_research
    type: rss
    url: https://owaspai.org/feed.xml
    enabled: false
    reliability: medium
    tags:
      - ai-security
      - owasp
  - id: sigmahq-sigma
    name: SigmaHQ Sigma Repository Metadata
    category: github_repository
    type: github_repository
    url: https://api.github.com/repos/SigmaHQ/sigma
    enabled: true
    reliability: high
    tags:
      - detection-rules
      - sigma
  - id: yara-rules
    name: YARA-Rules Repository Metadata
    category: github_repository
    type: github_repository
    url: https://api.github.com/repos/Yara-Rules/rules
    enabled: true
    reliability: medium
    tags:
      - detection-rules
      - yara
github_monitoring:
  search_terms:
    - CVE exploit
    - Sigma rule CVE
    - YARA rule malware
    - prompt injection detection
    - RAG poisoning
    - MCP security
  defensive_keywords:
    - detection
    - sigma
    - yara
    - suricata
    - incident-response
    - ioc
ai_attack_terms:
  - prompt injection
  - indirect prompt injection
  - jailbreak
  - model extraction
  - data poisoning
  - training data leakage
  - RAG poisoning
  - tool calling abuse
  - agent hijacking
  - malicious model
  - deepfake
  - AI phishing
  - autonomous agent
  - MCP
  - vector database

