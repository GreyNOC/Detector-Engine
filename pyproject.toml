[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greynoc-detector-engine"
version = "1.0.1"
description = "Defensive threat-intelligence and detection-engine framework for GreyNOC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GreyNOC" }]
dependencies = [
  "apscheduler>=3.10.4",
  "fastapi>=0.136.1",
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "idna>=3.15",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.1",
  "starlette>=0.49.1",
  "typer>=0.12.3",
  "uvicorn[standard]>=0.46.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=9.0.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.8",
]

[project.scripts]
greynoc-detector = "greynoc_detector_engine.cli.main:app"
gn = "greynoc_detector_engine.cli.gn:main"
GN = "greynoc_detector_engine.cli.gn:main"

[tool.hatch.build.targets.wheel]
packages = ["src/greynoc_detector_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
packages = ["greynoc_detector_engine"]
strict = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "feedparser", "yaml"]
ignore_missing_imports = true
