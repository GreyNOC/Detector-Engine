# --- Detection-rule repositories (opt-in clone-and-harvest) --------------
# These are *defensive content* repos. The engine clones them shallowly via
# the safe GitCloner, walks text files (yml/yara/rules/md/json/txt) under
# size caps, and stores excerpts as SourceItems. Code is never executed.
# Each source must declare its own `clone_allowlist` of host/path prefixes.
detection_rule_repositories:
  - id: sigma-hq
    name: SigmaHQ Sigma Rules
    category: security_research_blog
    type: git_repository
    url: https://github.com/SigmaHQ/sigma.git
    enabled: false
    reliability: high
    tags: [detection, sigma, rule-content]
    metadata:
      clone_allowlist:
        - github.com/sigmahq/sigma
      content_extensions: [.yml, .yaml]
      max_file_size_kb: 256
      max_total_size_mb: 100
      cleanup_after_ingest: true
      clone_timeout_s: 120
  - id: yara-rules
    name: YARA-Rules
    category: security_research_blog
    type: git_repository
    url: https://github.com/Yara-Rules/rules.git
    enabled: false
    reliability: high
    tags: [detection, yara, rule-content]
    metadata:
      clone_allowlist:
        - github.com/yara-rules/rules
      content_extensions: [.yar, .yara]
      max_file_size_kb: 256
      max_total_size_mb: 100
      cleanup_after_ingest: true
  - id: signature-base
    name: Florian Roth signature-base
    category: security_research_blog
    type: git_repository
    url: https://github.com/Neo23x0/signature-base.git
    enabled: false
    reliability: high
    tags: [detection, yara, sigma, rule-content]
    metadata:
      clone_allowlist:
        - github.com/neo23x0/signature-base
      content_extensions: [.yar, .yara, .yml, .yaml]
      max_file_size_kb: 256
      max_total_size_mb: 100
      cleanup_after_ingest: true

