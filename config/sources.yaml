version: 2
policy:
  defensive_only: true
  store_untrusted_code: false
  execute_untrusted_code: false        # ABSOLUTE — never relaxed
  github_metadata_only: true            # for github_search sources
  osint_ioc_storage: metadata_only
  ransomware_leak_tracking: metadata_only
  git_clone:
    enabled: opt_in                     # disabled unless a source enables itself
    require_per_source_allowlist: true  # always enforced; no global allowlist
    https_only: true
    shallow_only: true                  # --depth=1 --single-branch
    no_submodules: true
    content_only: true                  # text files only; never executed
    default_max_file_size_kb: 256
    default_max_total_size_mb: 100
    default_clone_timeout_s: 60

